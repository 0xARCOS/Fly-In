[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-in"
version = "0.1.0"
description = "Simulador de coordinación de drones sobre un grafo de zonas (WHCA*)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["fly_in*"]

[tool.mypy]
python_version = "3.10"
no_implicit_optional = true
exclude = ["\\.venv"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-in"
version = "0.1.0"
description = "Drone coordination simulator over a graph of zones (WHCA*)"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["fly_in*"]

[tool.mypy]
python_version = "3.10"
no_implicit_optional = true
exclude = ['(^|/)(\.?venv|\.?env|build|dist)/']
[tool.pytest.ini_options]
testpaths = ["test"]
